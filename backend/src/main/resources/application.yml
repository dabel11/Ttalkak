spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ttalkak?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false
  mvc:
    async:
      request-timeout: 180000

jwt:
  secret: ${JWT_SECRET:ttalkak-secret-key-must-be-at-least-256-bits-long-32chars}
  access-token-expiry: 3600000      # 1 hour
  refresh-token-expiry: 604800000   # 7 days

ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com/v1
    default-model: gpt-4o
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: https://api.anthropic.com
    default-model: claude-opus-4-5-20251001
    version: 2023-06-01

rate-limit:
  improve:
    anonymous-max-requests: 5
    window-hours: 24

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

server:
  port: ${PORT:8080}
