server:
  port: ${PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/ttalkak?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

rag:
  server-url: ${RAG_SERVER_URL:http://localhost:8000}
  response-timeout: ${RAG_RESPONSE_TIMEOUT:75s}
ttalkak:
  usage:
    quota-enabled: ${MEMBER_QUOTA_ENABLED:false}
    free-token-limit: ${FREE_TOKEN_LIMIT:0}
    pro-token-limit: ${PRO_TOKEN_LIMIT:0}
  auth:
    password-reset-enabled: ${PASSWORD_RESET_ENABLED:false}
    mail-from: ${AUTH_MAIL_FROM:}
    mail-transport: ${AUTH_MAIL_TRANSPORT:smtp}
    mail-test-recipient: ${AUTH_MAIL_TEST_RECIPIENT:}
    resend-api-key: ${RESEND_API_KEY:}
  cors:
    allowed-origin-patterns: "${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,chrome-extension://djbhhlahjhaeccghbnajnhmbcdilccmn}"

  admin:
    seed-enabled: "${ADMIN_SEED_ENABLED:false}"
    user-id: "${ADMIN_USER_ID:admin}"
    password: "${ADMIN_PASSWORD:}"
    nickname: "${ADMIN_NICKNAME:admin}"
    name: "${ADMIN_NAME:관리자}"

  jwt:
    secret-base64: "${JWT_SECRET_BASE64:}"
    expiration-minutes: "${JWT_EXPIRATION_MINUTES:120}"
    issuer: "${JWT_ISSUER:ttalkak}"

  billing:
    toss-client-key: "${TOSS_TEST_CLIENT_KEY:}"
    toss-secret-key: "${TOSS_TEST_SECRET_KEY:}"
    monthly-price-krw: "${PRO_MONTHLY_PRICE_KRW:4900}"
    provider-timeout: "${BILLING_PROVIDER_TIMEOUT:20s}"
    request-budget: "${BILLING_REQUEST_BUDGET:60s}"
    poll-ms: "${BILLING_POLL_MS:60000}"
