server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/ttalkak?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

rag:
  server-url: ${RAG_SERVER_URL:http://localhost:8000}
ttalkak:
  cors:
    allowed-origin-patterns: "${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}"

  admin:
    seed-enabled: "${ADMIN_SEED_ENABLED:false}"
    user-id: "${ADMIN_USER_ID:admin}"
    password: "${ADMIN_PASSWORD:}"
    nickname: "${ADMIN_NICKNAME:admin}"
    name: "${ADMIN_NAME:관리자}"

  jwt:
    secret-base64: "${JWT_SECRET_BASE64:}"
    expiration-minutes: "${JWT_EXPIRATION_MINUTES:120}"
    issuer: "${JWT_ISSUER:ttalkak}"
