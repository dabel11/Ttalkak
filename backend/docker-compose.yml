services:
  mysql:
    image: mysql:8.0
    container_name: ttalkak-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ttalkak
      MYSQL_USER: ttalkak
      MYSQL_PASSWORD: ttalkak
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - ttalkak_mysql_data:/var/lib/mysql

  backend:
    build: .
    container_name: ttalkak-backend
    depends_on:
      - mysql
    ports:
      - "8090:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ttalkak?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ttalkak
      SPRING_DATASOURCE_PASSWORD: ttalkak
      RAG_SERVER_BASE_URL: http://host.docker.internal:8000

volumes:
  ttalkak_mysql_data:
