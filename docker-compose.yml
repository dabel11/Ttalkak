# Ttalkak 통합 스택 (MySQL + rag-server)
# MySQL 정의는 backend/compose.yaml(백엔드 팀 버전)을 기준으로 통합했다.
# 사용:
#   docker compose up -d mysql       # MySQL만
#   docker compose up -d             # MySQL + rag-server 전체
#   docker compose down              # 중지 (데이터는 볼륨에 보존)
#   docker compose down -v           # 데이터까지 삭제

services:
  mysql:
    image: mysql:8.0
    container_name: ttalkak-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ttalkak}
      TZ: Asia/Seoul

    ports:
      - "${MYSQL_PORT:-3306}:3306"

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      - ttalkak_mysql_data:/var/lib/mysql   # 데이터 영속

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  rag-server:
    build: ./rag-server
    container_name: ttalkak-rag
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./rag-server/.env   # GROQ_API_KEY 등 LLM 키 (git 미추적)
    environment:
      DB_HOST: mysql          # 컨테이너 네트워크에선 호스트가 서비스명
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-ttalkak}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}   # MySQL root 비밀번호와 동일 소스
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface   # bge-m3 모델 캐시(재다운로드 방지)
    healthcheck:
      # /health 응답 확인. 첫 기동은 모델 다운로드+로드로 오래 걸릴 수 있어 start_period 여유
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s

volumes:
  ttalkak_mysql_data:
  hf-cache:
