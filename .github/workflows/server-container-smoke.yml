name: Server container smoke
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'docker/**'
      - 'scripts/**'
      - 'shared/**'
      - 'prompt-hub-web-frontend/**'
      - '.dockerignore'
      - '.github/workflows/server-container-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    name: MySQL and server containers guest policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build and start disposable stack
        run: docker compose -p ttalkak-ci -f docker/compose.ci.yml up -d --build
      - name: Check guest policy through nginx and restart
        run: python3 scripts/check-server-guest-policy.py
      - name: Container logs
        if: always()
        run: docker compose -p ttalkak-ci -f docker/compose.ci.yml logs --no-color --tail 150
      - name: Remove disposable CI stack
        if: always()
        run: docker compose -p ttalkak-ci -f docker/compose.ci.yml down -v
