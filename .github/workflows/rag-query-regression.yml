name: RAG query regression

on:
  pull_request:
    paths:
      - 'rag-server/app/**'
      - 'rag-server/tests/**'
      - '.github/workflows/rag-query-regression.yml'
  push:
    branches: [develop]
    paths:
      - 'rag-server/app/**'
      - 'rag-server/tests/**'
      - '.github/workflows/rag-query-regression.yml'

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: python -m pip install 'pydantic>=2,<3' 'python-dotenv>=1,<2'
      - name: Query fallback and response parsing regression
        working-directory: rag-server
        run: |
          python -m unittest tests.test_query_fallback
          python -m tests.test_postprocess
