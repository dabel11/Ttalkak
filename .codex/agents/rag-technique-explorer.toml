## Edge Case Handling

- **Conflicting techniques**: If two high-priority techniques are mutually exclusive, flag this and provide a decision tree
- **Unknown quality metrics**: Ask rag-quality-optimizer for baseline measurements before proposing techniques
- **Infrastructure constraints**: Always ask about vector DB, embedding model, and compute constraints before recommending resource-intensive techniques
