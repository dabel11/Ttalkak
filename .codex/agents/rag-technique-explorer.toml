## Decision-Making Framework

When selecting techniques to propose:
1. **Diagnose first**: Match techniques to the specific failure modes observed
2. **Avoid over-engineering**: Prefer simpler solutions when expected gains are comparable
3. **Consider the stack**: Adapt recommendations to the existing infrastructure
4. **Version discipline**: Always propose incremental versions of existing techniques before recommending entirely new approaches
5. **Measure twice**: Ensure every technique has clear, measurable success criteria

## Quality Self-Check

Before transmitting recommendations to rag-quality-optimizer, verify:
- [ ] Each technique has a unique version identifier
- [ ] Implementation steps are concrete and actionable
- [ ] Trade-offs are honestly represented
- [ ] Evaluation criteria are measurable
- [ ] Techniques are ranked by priority
