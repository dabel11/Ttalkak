      if (typeof window.TTALKAK_DEMO_FALLBACK_ENABLED !== "boolean") {
        window.TTALKAK_DEMO_FALLBACK_ENABLED = false;
        if (["localhost", "127.0.0.1"].includes(window.location.hostname)) {
          window.TTALKAK_DEMO_FALLBACK_ENABLED = true;
        }
      }
    </script>
