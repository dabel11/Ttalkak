# Railway terminates HTTPS before nginx. Preserve that scheme for Spring/CORS.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# Compress text assets at the origin as well as at the Railway edge. WOFF2 is
# already compressed and is intentionally omitted.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/css application/javascript application/json image/svg+xml;

server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver ${DNS_RESOLVER} valid=10s;

    location ^~ /api/ {
        # Resolve again after backend redeploys; preserve the complete /api/... URI.
        set $backend_upstream "${BACKEND_UPSTREAM}";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 5s;
        # RAG defaults to 75 seconds. Keep the proxy above that deadline.
        proxy_read_timeout ${PROXY_READ_TIMEOUT};
        proxy_send_timeout ${PROXY_READ_TIMEOUT};
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Production JavaScript filenames contain an esbuild content hash, so they
    # remain safe to cache across deployments.
    location ~* ^/assets/(?:app-[a-z0-9]+|chunks/[^/]+-[a-z0-9]+)\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # CSS filenames and their query versions are stable across some deploys.
    # Keep the cached response, but revalidate it so new JS cannot pair with
    # stale styles after a release.
    location ~* \.css$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Fonts and images also have stable filenames, so cache them briefly without
    # immutable and allow a normal refresh after the window.
    location ~* \.(?:woff2?|ttf|otf|png|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
