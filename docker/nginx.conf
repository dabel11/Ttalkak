# web 서비스(nginx:alpine)용 설정 — 기본 default.conf 에 .mjs 매핑만 추가한 것.
#
# 왜 필요한가: nginx 기본 mime.types 에는 .mjs 가 없어 application/octet-stream 으로
# 나간다. 브라우저는 ES 모듈의 MIME 을 엄격히 검사하므로 모듈 로딩이 거부되고,
# index.html 은 200 이지만 화면은 백지가 된다(웹 프론트가 ESM 전환 후 .mjs 106개).
#
# 주의: 이 증상은 브라우저 캐시에 한 번 박히면 수정 후에도 남는다. 304 응답에는
# Content-Type 이 없어 브라우저가 캐시된 옛 타입을 계속 쓰기 때문 → 강제 새로고침 필요.

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # 정규식 location 이 prefix 보다 우선 — .mjs 는 여기서 타입이 정해진다.
    location ~ \.mjs$ {
        root   /usr/share/nginx/html;
        types { application/javascript  mjs; }
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
